name: Verify native game
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Godot and templates
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Formatting and native static checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Behavior, real saves and all routes
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Source safety and rendered coverage gates
        shell: pwsh
        run: ./scripts/quality.ps1
      - name: Windows and Android builds
        shell: pwsh
        run: ./scripts/build.ps1 -Target All
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chromatic-rush-validation
          path: |
            builds/*.exe
            builds/*.apk
            builds/*.sha256
            builds/logs/*
            builds/coverage/*
            docs/evidence/quality-coverage.json
            docs/evidence/route_audit.json
